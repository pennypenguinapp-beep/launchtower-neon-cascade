<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Cascade — LaunchTower</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #131a2e;
    --accent: #00f0ff;
    --accent2: #ff00e0;
    --text: #e8f4ff;
    --dim: #7a8bb5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(0,240,255,.7);
  }
  #hud {
    display: flex;
    gap: 24px;
    font-size: 14px;
    color: var(--dim);
    letter-spacing: 1px;
  }
  #hud b { color: var(--text); font-size: 16px; }
  #wrap {
    position: relative;
    line-height: 0;
  }
  canvas {
    background: #05070f;
    border: 2px solid #1e2a4a;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0,240,255,.15), inset 0 0 40px rgba(0,0,0,.6);
    max-width: 92vw;
    max-height: 70vh;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(5,7,15,.82);
    backdrop-filter: blur(3px);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 {
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--accent2);
    text-shadow: 0 0 14px rgba(255,0,224,.7);
  }
  #overlay p { color: var(--dim); font-size: 14px; line-height: 1.6; max-width: 420px; }
  #overlay .score { font-size: 20px; color: var(--text); }
  button {
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-size: 15px;
    letter-spacing: 2px;
    padding: 10px 28px;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all .15s;
  }
  button:hover {
    background: var(--accent);
    color: #05070f;
    box-shadow: 0 0 18px rgba(0,240,255,.8);
  }
  #footer { font-size: 11px; color: #3a4a70; letter-spacing: 1px; }
</style>
</head>
<body>
  <h1>Neon Cascade</h1>
  <div id="hud">
    <div>SCORE <b id="score">0</b></div>
    <div>CHAIN <b id="chain">x1</b></div>
    <div>LEVEL <b id="level">1</b></div>
    <div>BEST <b id="best">0</b></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="480" height="640"></canvas>
    <div id="overlay">
      <h2 id="ovTitle">NEON CASCADE</h2>
      <p id="ovText">Drop glowing orbs into the grid. Match 3+ same-color orbs to cascade them. Cascades multiply your score. Don't let the grid overflow!</p>
      <div class="score" id="ovScore" style="display:none"></div>
      <button id="btn">START</button>
    </div>
  </div>
  <div id="footer">LAUNCHTOWER &middot; ARROWS / A D TO MOVE &middot; SPACE OR DOWN TO DROP &middot; P TO PAUSE</div>

<script>
(() => {
  'use strict';

  // ---------- Config ----------
  const COLS = 8;
  const ROWS = 12;
  const CELL = 40;
  const COLORS = ['#00f0ff', '#ff00e0', '#ffe600', '#00ff9d', '#ff5e00'];
  const SPAWN_ROWS = 2; // hidden spawn area above visible grid
  const TOTAL_ROWS = ROWS + SPAWN_ROWS;

  // ---------- Canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  // ---------- DOM ----------
  const elScore = document.getElementById('score');
  const elChain = document.getElementById('chain');
  const elLevel = document.getElementById('level');
  const elBest  = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovScore = document.getElementById('ovScore');
  const btn     = document.getElementById('btn');

  // ---------- State ----------
  let grid;            // grid[r][c] = colorIndex or -1
  let current;         // { type: 0..5, rot: 0..3, x (col float), y (row float), vy }
  let score, chain, level, best;
  let state;           // 'idle' | 'playing' | 'clearing' | 'gameover' | 'paused'
  let dropTimer, dropInterval;
  let clearingTimer;
  let clearingCells;   // array of {r,c,progress}
  let particles = [];
  let time = 0;

  best = parseInt(localStorage.getItem('neonCascadeBest') || '0', 10);
  elBest.textContent = best;

  // ---------- Tetromino-like shapes (orbs) ----------
  // Each shape: array of [dr, dc] offsets for rot 0; we rotate by swapping.
  const SHAPES = [
    [[0,0],[0,1],[1,0],[1,1]],          // square
    [[0,0],[0,1],[0,2],[0,3]],          // line
    [[0,0],[0,1],[1,1],[1,2]],          // S
    [[0,1],[0,2],[1,0],[1,1]],          // Z
    [[0,0],[0,1],[0,2],[1,1]],          // T
    [[0,0],[1,0],[2,0],[3,0]],          // vertical line
  ];

  function rotateOffsets(cells, rot) {
    let out = cells.map(c => [c[0], c[1]]);
    for (let i = 0; i < rot; i++) {
      out = out.map(([r, c]) => [c, -r]);
      // normalize to min 0
      const minR = Math.min(...out.map(p => p[0]));
      const minC = Math.min(...out.map(p => p[1]));
      out = out.map(([r, c]) => [r - minR, c - minC]);
    }
    return out;
  }

  function shapeCells(type, rot) {
    return rotateOffsets(SHAPES[type % SHAPES.length], rot);
  }

  function cellsAt(type, rot, x, y) {
    return shapeCells(type, rot).map(([dr, dc]) => [y + dr, x + dc]);
  }

  function collides(type, rot, x, y) {
    for (const [r, c] of cellsAt(type, rot, x, y)) {
      if (c < 0 || c >= COLS || r >= TOTAL_ROWS) return true;
      if (r >= 0 && grid[r][c] !== -1) return true;
    }
    return false;
  }

  // ---------- Grid ----------
  function newGrid() {
    grid = [];
    for (let r = 0; r < TOTAL_ROWS; r++) {
      grid.push(new Array(COLS).fill(-1));
    }
  }

  function spawnPiece() {
    const type = Math.floor(Math.random() * SHAPES.length);
    const color = Math.floor(Math.random() * COLORS.length);
    const x = Math.floor((COLS - 2) / 2);
    const y = -2;
    current = { type, rot: 0, x, y, color, vy: 0 };
    if (collides(type, 0, x, y)) {
      // try shifting
      let placed = false;
      for (let dx = -2; dx <= 2 && !placed; dx++) {
        if (!collides(type, 0, x + dx, y)) { current.x = x + dx; placed = true; }
      }
      if (!placed) { gameOver(); return; }
    }
  }

  function lockPiece() {
    for (const [r, c] of cellsAt(current.type, current.rot, current.x, current.y)) {
      if (r >= 0 && r < TOTAL_ROWS && c >= 0 && c < COLS) {
        grid[r][c] = current.color;
      }
    }
    // check top-out
    for (let c = 0; c < COLS; c++) {
      if (grid[0][c] !== -1) { gameOver(); return; }
    }
    const matches = findMatches();
    if (matches.length > 0) {
      state = 'clearing';
      clearingTimer = 0;
      clearingCells = matches.map(([r, c]) => ({ r, c, progress: 0 }));
      chain = 1;
    } else {
      chain = 1;
      spawnPiece();
    }
    updateHUD();
  }

  function findMatches() {
    const matched = new Set();
    // horizontal
    for (let r = 0; r < TOTAL_ROWS; r++) {
      let run = 1;
      for (let c = 1; c <= COLS; c++) {
        const same = c < COLS && grid[r][c] !== -1 && grid[r][c] === grid[r][c - 1];
        if (same) run++;
        else {
          if (run >= 3 && grid[r][c - 1] !== -1) {
            for (let k = c - run; k < c; k++) matched.add(r + ',' + k);
          }
          run = 1;
        }
      }
    }
    // vertical
    for (let c = 0; c < COLS; c++) {
      let run = 1;
      for (let r = 1; r <= TOTAL_ROWS; r++) {
        const same = r < TOTAL_ROWS && grid[r][c] !== -1 && grid[r][c] === grid[r - 1][c];
        if (same) run++;
        else {
          if (run >= 3 && grid[r - 1][c] !== -1) {
            for (let k = r - run; k < r; k++) matched.add(k + ',' + c);
          }
          run = 1;
        }
      }
    }
    return [...matched].map(s => { const [r, c] = s.split(',').map(Number); return [r, c]; });
  }

  function applyGravity() {
    let moved = false;
    for (let c = 0; c < COLS; c++) {
      let write = TOTAL_ROWS - 1;
      for (let r = TOTAL_ROWS - 1; r >= 0; r--) {
        if (grid[r][c] !== -1) {
          if (write !== r) {
            grid[write][c] = grid[r][c];
            grid[r][c] = -1;
            moved = true;
          }
          write--;
        }
      }
    }
    return moved;
  }

  // ---------- Particles ----------
  function burst(r, c, colorIdx) {
    const px = (c + 0.5) * CELL;
    const py = (r - SPAWN_ROWS + 0.5) * CELL;
    const col = COLORS[colorIdx];
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({
        x: px, y: py,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1,
        life: 1,
        color: col,
        size: 2 + Math.random() * 3,
      });
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.life -= dt * 1.6;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- Game flow ----------
  function startGame() {
    newGrid();
    score = 0;
    chain = 1;
    level = 1;
    dropInterval = 0.8;
    dropTimer = 0;
    particles = [];
    state = 'playing';
    spawnPiece();
    overlay.classList.add('hidden');
    updateHUD();
  }

  function gameOver() {
    state = 'gameover';
    if (score > best) {
      best = score;
      localStorage.setItem('neonCascadeBest', String(best));
      elBest.textContent = best;
    }
    ovTitle.textContent = 'GAME OVER';
    ovText.textContent = 'The grid overflowed. The cascade ends here.';
    ovScore.style.display = 'block';
    ovScore.textContent = 'SCORE ' + score;
    btn.textContent = 'RETRY';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      ovTitle.textContent = 'PAUSED';
      ovText.textContent = 'Take a breath. The orbs will wait.';
      ovScore.style.display = 'none';
      btn.textContent = 'RESUME';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'playing';
      overlay.classList.add('hidden');
    }
  }

  function updateHUD() {
    elScore.textContent = score;
    elChain.textContent = 'x' + chain;
    elLevel.textContent = level;
  }

  // ---------- Input ----------
  let leftHeld = false, rightHeld = false, downHeld = false;

  function tryMove(dx) {
    if (state !== 'playing' || !current) return;
    if (!collides(current.type, current.rot, current.x + dx, current.y)) {
      current.x += dx;
    }
  }

  function tryRotate() {
    if (state !== 'playing' || !current) return;
    const nr = (current.rot + 1) % 4;
    // wall kicks
    for (const kick of [0, -1, 1, -2, 2]) {
      if (!collides(current.type, nr, current.x + kick, current.y)) {
        current.rot = nr;
        current.x += kick;
        return;
      }
    }
  }

  function hardDrop() {
    if (state !== 'playing' || !current) return;
    while (!collides(current.type, current.rot, current.x, current.y + 1)) {
      current.y++;
    }
    lockPiece();
  }

  window.addEventListener('keydown', (e) => {
    if (e.repeat && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW')) return;
    switch (e.code) {
      case 'ArrowLeft': case 'KeyA': leftHeld = true; tryMove(-1); break;
      case 'ArrowRight': case 'KeyD': rightHeld = true; tryMove(1); break;
      case 'ArrowDown': case 'KeyS': downHeld = true; break;
      case 'ArrowUp': case 'KeyW': case 'KeyX': tryRotate(); break;
      case 'Space': e.preventDefault(); hardDrop(); break;
      case 'KeyP': togglePause(); break;
      case 'Enter':
        if (state === 'idle' || state === 'gameover') startGame();
        else if (state === 'paused') togglePause();
        break;
    }
  });

  window.addEventListener('keyup', (e) => {
    switch (e.code) {
      case 'ArrowLeft': case 'KeyA': leftHeld = false; break;
      case 'ArrowRight': case 'KeyD': rightHeld = false; break;
      case 'ArrowDown': case 'KeyS': downHeld = false; break;
    }
  });

  btn.addEventListener('click', () => {
    if (state === 'idle' || state === 'gameover') startGame();
    else if (state === 'paused') togglePause();
    btn.blur();
  });

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    updateParticles(dt);

    if (state === 'clearing') {
      clearingTimer += dt;
      const dur = 0.35;
      for (const cell of clearingCells) {
        cell.progress = Math.min(1, clearingTimer / dur);
      }
      if (clearingTimer >= dur) {
        // remove cells, award score
        let count = clearingCells.length;
        for (const [r, c] of clearingCells) {
          const col = grid[r][c];
          if (col !== -1) burst(r, c, col);
          grid[r][c] = -1;
        }
        score += count * 10 * chain;
        // level up every 150 points
        const newLevel = Math.floor(score / 150) + 1;
        if (newLevel > level) {
          level = newLevel;
          dropInterval = Math.max(0.15, 0.8 - (level - 1) * 0.06);
        }
        chain++;
        applyGravity();
        const next = findMatches();
        if (next.length > 0) {
          clearingTimer = 0;
          clearingCells = next.map(([r, c]) => ({ r, c, progress: 0 }));
        } else {
          state = 'playing';
          chain = 1;
          spawnPiece();
        }
        updateHUD();
      }
      return;
    }

    if (state !== 'playing' || !current) return;

    // held movement with repeat
    if (leftHeld) tryMove(-1);
    if (rightHeld) tryMove(1);

    dropTimer += dt * (downHeld ? 6 : 1);
    if (dropTimer >= dropInterval) {
      dropTimer = 0;
      if (!collides(current.type, current.rot, current.x, current.y + 1)) {
        current.y++;
      } else {
        lockPiece();
      }
    }
  }

  // ---------- Render ----------
  function drawGrid() {
    // background cells
    ctx.strokeStyle = 'rgba(40,60,110,0.35)';
    ctx.lineWidth = 1;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        ctx.strokeRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
      }
    }
  }

  function drawOrb(x, y, colorIdx, scale = 1, glow = 1) {
    const px = (x + 0.5) * CELL;
    const py = (y - SPAWN_ROWS + 0.5) * CELL;
    const rad = (CELL * 0.38) * scale;
    const col = COLORS[colorIdx];
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = 18 * glow;
    const g = ctx.createRadialGradient(px - rad * 0.3, py - rad * 0.3, rad * 0.1, px, py, rad);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.25, col);
    g.addColorStop(1, shade(col, -0.55));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, Math.round(r * (1 + amt))));
    g = Math.max(0, Math.min(255, Math.round(g * (1 + amt))));
    b = Math.max(0, Math.min(255, Math.round(b * (1 + amt))));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function drawGhost() {
    if (!current) return;
    let gy = current.y;
    while (!collides(current.type, current.rot, current.x, gy + 1)) gy++;
    ctx.save();
    ctx.globalAlpha = 0.22;
    for (const [r, c] of cellsAt(current.type, current.rot, current.x, gy)) {
      if (r < SPAWN_ROWS) continue;
      drawOrb(c, r, current.color, 0.95, 0.4);
    }
    ctx.restore();
  }

  function drawCurrent() {
    if (!current) return;
    for (const [r, c] of cellsAt(current.type, current.rot, current.x, current.y)) {
      if (r < SPAWN_ROWS) continue;
      drawOrb(c, r, current.color, 1, 1);
    }
  }

  function drawLocked() {
    for (let r = 0; r < TOTAL_ROWS; r++) {
      if (r < SPAWN_ROWS) continue;
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] !== -1) drawOrb(c, r, grid[r][c], 1, 0.8);
      }
    }
  }

  function drawClearing() {
    for (const cell of clearingCells) {
      const s = 1 + cell.progress * 0.6;
      ctx.save();
      ctx.globalAlpha = 1 - cell.progress * 0.7;
      drawOrb(cell.c, cell.r, grid[cell.r][cell.c], s, 1.5);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawScanlines() {
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#000';
    for (let y = 0; y < canvas.height; y += 4) {
      ctx.fillRect(0, y, canvas.width, 2);
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    drawLocked();
    if (state === 'playing' || state === 'paused') {
      drawGhost();
      drawCurrent();
    }
    if (state === 'clearing') drawClearing();
    drawParticles();
    drawScanlines();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // initial state
  state = 'idle';
  newGrid();
})();
</script>
</body>
</html>
