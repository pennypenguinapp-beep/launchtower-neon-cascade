<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Cascade — LaunchTower</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------- audio ----------
let audioCtx = null;
function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } }
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

// ---------- state ----------
const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
let state = STATE.TITLE;
let score = 0, best = 0, combo = 0;
try { best = parseInt(localStorage.getItem("neonCascadeBest") || "0", 10) || 0; } catch(e) {}
let blocks = [];
let particles = [];
let stars = [];
let shake = 0;
let time = 0;
let spawnTimer = 0;
let speed = 1;
let flash = 0;
let flashColor = "#00f0ff";

// ---------- stars ----------
function initStars() {
  stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.3, s: Math.random() * 0.4 + 0.1, tw: Math.random() * Math.PI * 2 });
  }
}
initStars();

// ---------- blocks ----------
const PALETTE = [
  { fill: "#00f0ff", glow: "rgba(0,240,255,0.55)" },
  { fill: "#ff2d95", glow: "rgba(255,45,149,0.55)" },
  { fill: "#a855f7", glow: "rgba(168,85,247,0.55)" },
  { fill: "#facc15", glow: "rgba(250,204,21,0.55)" },
  { fill: "#22c55e", glow: "rgba(34,197,94,0.55)" },
];

function spawnBlock() {
  const side = Math.floor(Math.random() * 4); // 0 top, 1 right, 2 bottom, 3 left
  const size = 26 + Math.random() * 30;
  let x, y, vx, vy;
  const sp = (1.6 + Math.random() * 1.6) * speed;
  if (side === 0) { x = Math.random() * W; y = -size; vx = (Math.random() - 0.5) * 1.2 * speed; vy = sp; }
  else if (side === 1) { x = W + size; y = Math.random() * H; vx = -sp; vy = (Math.random() - 0.5) * 1.2 * speed; }
  else if (side === 2) { x = Math.random() * W; y = H + size; vx = (Math.random() - 0.5) * 1.2 * speed; vy = -sp; }
  else { x = -size; y = Math.random() * H; vx = sp; vy = (Math.random() - 0.5) * 1.2 * speed; }
  const p = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  blocks.push({ x, y, vx, vy, size, rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.04, color: p, dead: false, pop: 0 });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1.5 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.02 + Math.random() * 0.02, r: 1.5 + Math.random() * 3, color });
  }
}

function reset() {
  blocks = []; particles = []; score = 0; combo = 0; speed = 1; spawnTimer = 0; shake = 0; flash = 0;
}

function startGame() {
  initAudio();
  reset();
  state = STATE.PLAY;
  beep(440, 0.12, "sine", 0.06);
}

function gameOver() {
  state = STATE.OVER;
  shake = 14;
  flash = 1; flashColor = "#ff2d55";
  beep(110, 0.5, "sawtooth", 0.1);
  if (score > best) { best = score; try { localStorage.setItem("neonCascadeBest", String(best)); } catch(e) {} }
}

function popBlock(b) {
  b.dead = true;
  const gained = 10 + combo * 2;
  score += gained;
  combo++;
  speed = 1 + Math.min(score / 400, 1.6);
  burst(b.x, b.y, b.color.fill, 14 + Math.min(combo, 10));
  flash = Math.max(flash, 0.25); flashColor = b.color.fill;
  beep(300 + Math.min(combo * 40, 600), 0.08, "triangle", 0.07);
}

// ---------- input ----------
function handlePoint(px, py) {
  if (state === STATE.TITLE) { startGame(); return; }
  if (state === STATE.OVER) { startGame(); return; }
  if (state !== STATE.PLAY) return;
  let hit = null, hitD = 1e9;
  for (const b of blocks) {
    if (b.dead) continue;
    const dx = b.x - px, dy = b.y - py;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < b.size * 0.75 + 22 && d < hitD) { hitD = d; hit = b; }
  }
  if (hit) { popBlock(hit); }
  else {
    combo = 0;
    burst(px, py, "#ffffff", 4);
    beep(140, 0.06, "square", 0.04);
  }
}

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  handlePoint(e.clientX - r.left, e.clientY - r.top);
});

window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (state === STATE.TITLE || state === STATE.OVER) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); startGame(); }
    return;
  }
  if (e.key === " ") {
    e.preventDefault();
    // pop the nearest block to center
    let hit = null, hitD = 1e9;
    for (const b of blocks) {
      if (b.dead) continue;
      const d = Math.sqrt((b.x - W / 2) ** 2 + (b.y - H / 2) ** 2);
      if (d < hitD) { hitD = d; hit = b; }
    }
    if (hit) popBlock(hit); else { combo = 0; beep(140, 0.06, "square", 0.04); }
  }
});

// ---------- update ----------
function update(dt) {
  time += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);

  for (const s of stars) {
    s.y += s.s * dt * 60;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }

  if (state === STATE.PLAY) {
    spawnTimer -= dt;
    const interval = Math.max(0.28, 0.9 - score / 500);
    if (spawnTimer <= 0) { spawnBlock(); spawnTimer = interval; }

    for (const b of blocks) {
      if (b.dead) continue;
      b.x += b.vx * dt * 60;
      b.y += b.vy * dt * 60;
      b.rot += b.vr;
      const m = b.size;
      if (b.x < -m * 2 || b.x > W + m * 2 || b.y < -m * 2 || b.y > H + m * 2) {
        gameOver();
        return;
      }
    }
    blocks = blocks.filter(b => !b.dead);
  }

  for (const p of particles) {
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.vx *= 0.97; p.vy *= 0.97;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---------- draw ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0a0a18");
  g.addColorStop(0.5, "#0d0d20");
  g.addColorStop(1, "#120a1e");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // subtle grid
  ctx.strokeStyle = "rgba(120,120,255,0.05)";
  ctx.lineWidth = 1;
  const gs = 48;
  for (let x = 0; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // stars
  for (const s of stars) {
    const a = 0.3 + 0.5 * Math.abs(Math.sin(time * 1.5 + s.tw));
    ctx.fillStyle = `rgba(200,210,255,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawBlock(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot);
  const s = b.size;
  ctx.shadowColor = b.color.fill;
  ctx.shadowBlur = 18;
  ctx.strokeStyle = b.color.fill;
  ctx.lineWidth = 2.5;
  ctx.strokeRect(-s / 2, -s / 2, s, s);
  ctx.shadowBlur = 0;
  ctx.fillStyle = b.color.glow;
  ctx.fillRect(-s / 2 + 3, -s / 2 + 3, s - 6, s - 6);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawText(text, x, y, size, color, align, glow) {
  ctx.font = `700 ${size}px 'Segoe UI', system-ui, sans-serif`;
  ctx.textAlign = align || "center";
  ctx.textBaseline = "middle";
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 20; }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
}

function drawTitle() {
  drawText("NEON CASCADE", W / 2, H * 0.32, Math.min(W * 0.09, 56), "#ffffff", "center", "#00f0ff");
  drawText("pop the blocks before they escape", W / 2, H * 0.42, Math.min(W * 0.035, 18), "rgba(200,210,255,0.8)");
  const pulse = 0.6 + 0.4 * Math.sin(time * 3);
  ctx.globalAlpha = pulse;
  drawText("TAP  /  CLICK  /  SPACE", W / 2, H * 0.56, Math.min(W * 0.04, 22), "#00f0ff", "center", "#00f0ff");
  ctx.globalAlpha = 1;
  if (best > 0) drawText("BEST  " + best, W / 2, H * 0.66, Math.min(W * 0.035, 18), "rgba(250,204,21,0.9)");
  drawText("a LaunchTower game", W / 2, H * 0.88, Math.min(W * 0.025, 13), "rgba(160,170,220,0.5)");
}

function drawHUD() {
  drawText(String(score), 24, 30, 26, "#ffffff", "left", "#00f0ff");
  if (combo > 1) drawText("x" + combo, 24, 58, 16, "#facc15", "left", "#facc15");
  drawText("BEST " + Math.max(best, score), W - 24, 30, 15, "rgba(200,210,255,0.7)", "right");
}

function drawOver() {
  ctx.fillStyle = "rgba(5,5,15,0.55)";
  ctx.fillRect(0, 0, W, H);
  drawText("GAME OVER", W / 2, H * 0.34, Math.min(W * 0.08, 48), "#ff2d55", "center", "#ff2d55");
  drawText("SCORE  " + score, W / 2, H * 0.46, Math.min(W * 0.05, 28), "#ffffff");
  if (score >= best && score > 0) drawText("NEW BEST!", W / 2, H * 0.54, Math.min(W * 0.035, 18), "#facc15", "center", "#facc15");
  const pulse = 0.6 + 0.4 * Math.sin(time * 3);
  ctx.globalAlpha = pulse;
  drawText("TAP TO RESTART", W / 2, H * 0.66, Math.min(W * 0.04, 20), "#00f0ff", "center", "#00f0ff");
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawBackground();
  if (flash > 0) {
    ctx.globalAlpha = flash * 0.18;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  drawParticles();
  for (const b of blocks) drawBlock(b);
  if (state === STATE.TITLE) drawTitle();
  if (state === STATE.PLAY) drawHUD();
  if (state === STATE.OVER) drawOver();
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>

<div style="text-align:center;padding:14px 16px;font-size:13px;color:#8b93a7;background:#0b0e14;border-top:1px solid #232c3f;">More free tools &amp; games: <a href="https://pennypenguinapp-beep.github.io/" style="color:#5eead4;">LaunchTower</a></div>
</body>
</html>
